name: Tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    name: Linux unit and UI render tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Run Python tests (Windows OCR integration remains skipped)
        run: python -m pytest tests -q -rs
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Run UI render tests
        run: node --test tests/test_ui_render.cjs
